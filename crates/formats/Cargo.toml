[package]
name = "pixminima-formats"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Verified lossless optimizers for PixMinima"

[dependencies]
pixminima-png = { path = "../png-engine" }
smallpeg = { path = "vendor/smallpeg" }
weezl = "=0.2.1"
image-webp = "=0.2.4"
rusty_webp = { version = "=0.2.1", default-features = false }
webp-rust = { version = "=0.5.0", default-features = false }
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true

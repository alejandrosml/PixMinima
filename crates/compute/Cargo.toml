[package]
name = "pixminima-compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional Metal row-filter scoring for RGBA8 PNGs"

[lints]
workspace = true

[features]
metal = ["dep:wgpu", "dep:pollster"]

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.2", optional = true, default-features = false, features = ["std","metal","wgsl"] }
pollster = { version = "1.0.1", optional = true }

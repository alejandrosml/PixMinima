[package]
name = "pixminima-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
metal = ["pixminima-compute/metal"]
archive-jxl = ["dep:pixminima-jxl", "pixminima-jxl/archive"]

[dependencies]
pixminima-png = {path = "../png-engine"}
pixminima-compute = {path = "../compute"}
pixminima-formats = {path = "../formats"}
pixminima-extra = {path = "../extra-formats"}
pixminima-containers = {path = "../containers"}
pixminima-jxl = {path = "../archive-jxl", optional = true}
tempfile = "3"
sha2-const-stable = "=0.1.0"
unicode-normalization = "0.1"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
renamest = "=0.1.3"
winapi-util = "=0.1.11"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
